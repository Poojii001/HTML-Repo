<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <form>
    <h1>Application Form</h1><br/>
    <label for="name">First Name:</label>
    <input type="text" id="fname"/>
    <label for="name">Last Name:</label>
    <input type="text" id="lname"/><br/><br/>

   <label for="dob">Date of Birth:</label>
    <input type="date" />
    <label for="age">Age:</label>
    <input type="number" id="age"/><br/><br/> 

    Gender:
    <select>
      <option>Male</option>
      <option>Female</option>
    </select>
    

    <label for="email">Email Address:</label>
    <input type="email" id="email" placeholder="Enter email address"/><br/><br/>

    Position Available:
    <input type="radio" name="a"/>Junior Developer
    <input type="radio" name="a"/>Mid Developer
    <input type="radio" name="a" />Senior Developer
    <br/><br/>

    Programming Langiages:
    <input type="checkbox"/>Java
    <input type="checkbox"/>JavaScript
    <input type="checkbox"/>Python <br/><br/>

    <label for="password">Password:</label>
    <input type="password" id="pwd"/>
    
    <label for="password">Confirm Password:</label>
    <input type="password" id="cpwd"/><br/><br/>

    <input type="Submit" value="submit"/>
    <input type="Reset" value="reset"/>
  </form>
</body>
</html>

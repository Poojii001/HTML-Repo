<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background:black;

        }
        #outer
        {
            height:200px;
            width:200px;
            border:20px solid grey;
            border-radius:50%;
            margin:100px auto;
            border-top:20px solid yellowgreen;
            position:relative;
            animation-name:loader;
            animation-duration:1s;
            animation-iteration-count:infinite;
            animation-timing-function:linear;
            animation-delay:2s;
        }
        #dot{
            height:30px;
            width:30px;
            background:yellowgreen;
            border-radius:50%;
            position:absolute;
            right:0px;
            top:20px;
            box-shadow:0px 0px 1px 5px rgb(154, 205, 50,.8),
            0px 0px 1px 10px rgb(154, 205, 50,.6),0px 0px 1px 15px rgb(154, 205, 50,.4),
            0px 0px 1px 20px rgb(154, 205, 50,.4);
        }
        #outer:hover
        {
            transform:rotate(360deg);
            transition:all 1s;
        }
        @keyframes loader
        {
            from{
                transform:rotate(0deg)
            }
            to{
                transform:rotate(360deg)
            }
        }
    </style>
</head>
<body>
    <div id="outer">
    <div id="dot"></div>
    </div>
</body>
</html>

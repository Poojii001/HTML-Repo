<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #outer{
            height:400px;
            width:200px;
            background:black;
        }
        .row{
            height:200px;
            width:400px;
            background:hotpink;
        }
        .r,.b{
            height:200px;
            width:200px;
            float:left;
            background:red;
        }
        .g,.a{
            height:200px;
            width:200px;
            float:left;
            background:yellowgreen;
        }
    </style>
</head>
<body>
    <div id="outer">
          <div class="row">
            <div class="r"></div>
            <div class="g"></div>
          </div>
          <div class="row">
            <div class="a"></div>
            <div class="b"></div>
          </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #outer
        {
            height:500px;
            width:800px;
            background:yellow;
        }
        #top{
            height:200px;
            width:800px;
            background:black;
        }
        #bottom{
            height:300px;
            width:800px;
            background:grey;
        }
        #a{
            height:300px;
            width:100px;
            float:left;
            background:rebeccapurple;
        }
        #b{
            height:300px;
            width:100px;
            float:left;
            background:hotpink;
        }
        #c{
            height:300px;
            width:400px;
            float:left;
            background:navy;
        }
        #c1,#c3
        {
            height:100px;
            width:400px;
            background:aqua;
        }
        #c2{
            height:100px;
            width:400px;
            background:orangered;
        }
    </style>
</head>
<body>
    <div id="outer">
        <div id="top"></div>
        <div id="bottom">
            <div id="a"></div>
            <div id="b"></div>
            <div id="c">
                <div id="c1"></div>
                <div id="c2"></div>
                <div id="c3"></div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height:500px;
            width:800px;
            background:url(Tasks/images/a.jpeg);
            margin:40px auto;
            border:10px solid yellowgreen;
            background-size:cover;
            text-align:center;
            line-height:500px;
            font-size:120px;
            font-weight:bold;
            color:white;
            text-shadow:0px 0px 20px black;
            animation-name:change;
            animation-duration:2s;
            animation-iteration-count:infinite;
        }
        @keyframes change
        {
            from{
                 background:url(Tasks/images/p6.jpg);
                 font-size:100px;
                 color:pink;
                 text-shadow:0px 0px 10px red;
            }
            to{
                background:url(Tasks/images/p7.jpg);
                font-size:130px;
                color:blueviolet;
                text-shadow:0px 0px 10px green;
            }
        }
    </style>
</head>
<body>
    <div>
        TECHPILE
    </div>
</body>
</html>

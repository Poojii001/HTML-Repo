<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Dropdown list || Combo box</h1><br/>
    <hr/>
    <select multiple>
        <option>-----Select Course---</option>
        <option value="ST">Summer Training</option>
        <option value="WT">Winter Training</option>
        <option> Apprenticeship Training</option>
        <option disabled>IT Training</option>
    
    <hr/>
    <h1>Dropdown with option group</h1>
    <optgroup disabled label="Front End Technology">
        <option>HTML</option>
        <option>CSS</option>
        <option>JS</option>
        <option>JQUERY</option>
        <option>BOOTSTRAP</option>
        <option>TAIWIND</option>
        <option>REACT</option>
        <option>ANGULAR</option>
    </optgroup>
    <optgroup disabled label="Back End Technology">
        <option>ASP .NET</option>
        <option>JSP</option>
        <option>PHP</option>
        <option>PYTHON</option>
        <option>NODEJS</option>
    </optgroup>
    </select>
</body>
</html>

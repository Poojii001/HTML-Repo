<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div
        {
            font-size:100px;
            text-align:center;
            line-height:600px;
            font-weight:bold;
            animation-name:abc;
            animation-duration:1s;
            animation-iteration-count:infinite;
           
        }
        @keyframes abc
        {
            from{
               color:brown;
               font-size:100px;
               text-shadow:0px 0px 20px grey;

            }
            to{
               color:yellowgreen;
               font-size:130px;
               text-shadow:100px 100px 1px navy;
 
            }
        }
    </style>
</head>
<body>
    <div>CODE HELPER</div>
</body>
</html>

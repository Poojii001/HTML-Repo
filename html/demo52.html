<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: pink;
        }
        #login{
            height:400px;
            width:650px;
            background:blueviolet;
            margin:180px auto;
            border-radius:10px;
            padding:50px;
            box-sizing:border-box;
            font-size:20px;

        }
        .txt{
            height:45px;
            width:100%;
            margin-bottom:20px;
            border:none;
            padding-left:15px;
            box-sizing:border-box;
            color:blueviolet;
            font-size:17px;
            background:whitesmoke;
        }
        #login:hover{
            background:white;
            transition:all 2s;
        }
        ::placeholder{
            color:pink;
        }
        .btn{
            height:50px;
            width:25%;
            background:pink;
            border:none;
        }
       
    </style>
</head>
<body>
    <div id="login">
        <div style="text-align:center;font-size:30px;">LOGIN<b style="color:maroon;"> FORM</b></div>
       <label>
        USERID<br/>
        <input type="email" class="txt" placeholder="USERID..."/>
       </label><br/>
       PASSWORD<br/>
       <label>
        <input type="password" class="txt" placeholder="PASSWORD..."/>
       </label><br/>
       <input type="button" class="btn" value="LOGIN"/>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    
</head>
<body bgcolor="aqua">
    <center>
      <h1>Use of Marque Tag</h1>
    </center>
    <hr/>
    <marquee hspace="50" direction="left" loop="3" onmouseover="stop()" bgcolor="skyblue" scrollamount="30" onmouseleave="start()"
     behavior="scroll">
        Welcome to techpile technology pvt ltd.
    </marquee>

    <marquee hspace="100" direction="right" onmouseover="stop()" bgcolor="red" onmouseleave="start()" scrollamount="20 
    behavior="alternate">
        Welcome to techpile technology pvt ltd.
    </marquee>

    <marquee hspace="150" direction="up" height="150px" onmouseover="stop()" bgcolor="pink" onmouseleave="start()">
        Welcome to techpile technology pvt ltd.
    </marquee>

    <marquee loop="3" direction="down" height="150px" onmouseover="stop()" bgcolor="yellow" 
    onmouseleave="start()" behavior="slide">
        Welcome to techpile technology pvt ltd.
    </marquee>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #parent{
            height:500px;
            width:400px;
            background:red;
            position:relative;
        }
        #child
        {
            height:50px;
            width:50px;
            background:yellow;
            position:absolute;
            top:-25px;
            right:-25px;
        }
    </style>
</head>
<body>
    <h1>POSITION IN CSS</h1>
    <div id="parent">
        <div id="child"></div>
    </div>
</body>
</html>

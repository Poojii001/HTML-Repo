<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box{
            height:300px;
            width:900px;
            border:1px solid black;
        }
        #a{
            height:300px;
            width:300px;
            float:left;
            color:white;
            background:black;
            padding:10px 20px;
            box-sizing:border-box;
            text-align:justify;
        }
        #b{
            height:200px;
            width:250px;
            float:left;
            background:grey;
            margin:50px 25px;
            }
        #c{
            height:300px;
            width:300px;
            float:left;
            background:black;
            box-sizing:border-box;
            border:50px double greenyellow;
        }
    </style>
</head>
<body>
    <div id="box">
        <div id="a">
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. 
                Reprehenderit deleniti beatae consequatur molestiae libero dolorem quos facilis omnis fuga dolor?</p>
        </div>
        <div id="b"></div>
        <div id="c"></div>
    </div>
</body>
</html>
